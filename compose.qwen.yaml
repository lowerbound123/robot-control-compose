x-qwen: &qwen
  user: "${RC_UID:?Run ./scripts/setup-user.sh first}:${RC_GID:?Run ./scripts/setup-user.sh first}"
  tmpfs:
    - /tmp/robot-control:uid=${RC_UID},gid=${RC_GID},mode=0700
  image: robot-control-compose-qwen35:local
  platform: linux/amd64
  pull_policy: never
  ipc: service:ipc-anchor
  depends_on:
    rpc-init:
      condition: service_completed_successfully
    ipc-anchor:
      condition: service_started
  environment:
    HOME: /tmp/robot-control
    XDG_CACHE_HOME: /tmp/robot-control/.cache
    HF_HOME: /data/huggingface
    HF_HUB_OFFLINE: ${QWEN_HF_HUB_OFFLINE:-0}
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  volumes:
    - rpc:/run/robot-control
    - type: bind
      source: ./policy
      target: /workspace/policy
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${QWEN_MODELS_DIR:-./models}
      target: /models
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${QWEN_HF_CACHE_DIR:-./cache/huggingface}
      target: /data/huggingface
      bind: {create_host_path: false}
  stop_grace_period: 45s

services:
  policy-qwen35-single:
    <<: *qwen
    # Build this service once; both services use precisely the same image tag.
    build:
      context: .
      dockerfile: docker/qwen35.Dockerfile
      target: runtime
    command: ["--host-id", "qwen35-single", "--socket", "/run/robot-control/qwen35-single.sock", "--policy-root", "/workspace/policy"]
    healthcheck:
      test: ["CMD", "python", "-m", "rc_policy_sdk.host", "--healthcheck", "--host-id", "qwen35-single", "--socket", "/run/robot-control/qwen35-single.sock", "--policy-root", "/workspace/policy"]
      interval: 2s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QWEN_SINGLE_GPU:-0}"]
              capabilities: [gpu]

  policy-qwen35-twostage:
    <<: *qwen
    command: ["--host-id", "qwen35-twostage", "--socket", "/run/robot-control/qwen35-twostage.sock", "--policy-root", "/workspace/policy"]
    healthcheck:
      test: ["CMD", "python", "-m", "rc_policy_sdk.host", "--healthcheck", "--host-id", "qwen35-twostage", "--socket", "/run/robot-control/qwen35-twostage.sock", "--policy-root", "/workspace/policy"]
      interval: 2s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QWEN_TWOSTAGE_GPU:-0}"]
              capabilities: [gpu]

  robot-control:
    depends_on:
      policy-qwen35-single:
        condition: service_healthy
      policy-qwen35-twostage:
        condition: service_healthy
