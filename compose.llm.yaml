# Optional CPU-only API policy; default mock + hold remains unchanged.
services:
  policy-llm-direction:
    image: robot-control-compose-llm-direction:local
    build:
      context: .
      dockerfile: docker/llm-direction.Dockerfile
      target: runtime
    ipc: service:ipc-anchor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ipc-anchor:
        condition: service_started
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - rpc:/run/robot-control
      - ./policy:/workspace/policy:ro
    healthcheck:
      test: ["CMD", "python", "-m", "rc_policy_sdk.host", "--healthcheck", "--host-id", "llm-direction", "--socket", "/run/robot-control/llm-direction.sock", "--policy-root", "/workspace/policy"]
      interval: 2s
      timeout: 3s
      retries: 20
    stop_grace_period: 45s

  robot-control:
    depends_on:
      policy-llm-direction:
        condition: service_healthy
