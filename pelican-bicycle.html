<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>鹈鹕的海岸骑行</title>
  <style>
    :root { color-scheme: light; --paper: #f4efe2; --ink: #213e40; --edge: #9ca89a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; align-items: center; color: var(--ink);
      background: var(--paper); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    main { width: min(1120px, 92vw); margin: clamp(20px, 4vw, 52px) auto; }
    .masthead, .imprint, .number, figcaption, .playback { display: flex; align-items: center; }
    .masthead { justify-content: space-between; gap: 15px; padding: 0 1px 12px; }
    .imprint { gap: 9px; font-size: 13px; font-weight: 700; letter-spacing: .16em; }
    .imprint svg { width: 32px; height: 27px; }
    .latin, .number, .subtitle { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .latin, .number { font-size: 10px; letter-spacing: .15em; }
    .latin { margin-left: 4px; font-weight: 500; }
    .number { gap: 10px; white-space: nowrap; }
    .number::before { content: ""; width: 31px; height: 1px; background: currentColor; }
    figure { margin: 0; }
    .frame { overflow: hidden; border: 1.5px solid var(--ink); background: #b1d7c8; }
    .scene { display: block; width: 100%; height: auto; aspect-ratio: 1120 / 600; }
    figcaption { justify-content: space-between; gap: 14px; padding: 18px 1px 3px; }
    h1 { font-family: "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif;
      margin: 0; font-size: clamp(25px, 3.2vw, 42px); line-height: 1.2; letter-spacing: .06em; }
    .subtitle { margin: 7px 0 0; font-size: 10px; letter-spacing: .19em; color: #536b67; }
    .playback { flex: none; gap: 9px; min-height: 40px; padding: 8px 14px; border: 1px solid var(--ink);
      border-radius: 30px; background: transparent; color: var(--ink); cursor: pointer;
      font: 600 12px/1.3 system-ui, sans-serif; letter-spacing: .08em; }
    .playback:hover { color: var(--paper); background: var(--ink); }
    .playback:focus-visible { outline: 3px solid #b75837; outline-offset: 3px; }
    .playback svg { width: 12px; height: 12px; fill: currentColor; }
    .playback[hidden], .playback[data-playing="true"] .play, .playback[data-playing="false"] .pause { display: none; }
    @media (max-width: 650px) {
      main { width: 95vw; }
      .scene { aspect-ratio: 1.07; height: auto; }
      .latin { display: none; }
      .number { font-size: 9px; }
      figcaption { padding-top: 14px; }
      .playback { padding-inline: 12px; }
    }
  </style>
</head>

            <path d="M395 286c27-2 48-13 69-27m-60 37c29-3 46-13 62-23m-49 30q32-7 51-20" fill="none" stroke="#849487" stroke-width="1.8"/>
            <path d="M568 155q-6 9-8 20m13-20-4 6m5 19q1 8 5 15m19-17q-6 11-3 22m-16-59q4-5 12-6" fill="none" stroke="#b6b89f" stroke-width="1.5"/>
            <path d="M462 243q8-7 18-8m-11 12q9-7 18-7m-8 11 10-4m-66 24 11-6m89 64 10-4m8 1 11-5" fill="none" stroke="#a6ad96" stroke-width="1.5"/>
          </g>
          <use href="#bird-shape" fill="none" stroke="#29494b" stroke-width="3.2"/>

          <!-- Blue cycling cap and the downy feathers above the eye. -->
          <g stroke="#2f4d4c">
            <path d="M562 133c2-13 9-25 21-30 18-8 34 1 44 15l-12 9-39 11z" fill="#507973" stroke-width="2.7"/>

        <svg viewBox="0 0 12 12" aria-hidden="true"><path class="pause" d="M2 1h2.5v10H2zm5.5 0H10v10H7.5z"/><path class="play" d="M2 1.2v9.6L10.5 6z"/></svg>
        <span id="playback-label">暂停动画</span>
      </button>

</main>
<script>
(() => {
  const get = id => document.getElementById(id);
  const translate = (node, x, y = 0) => node.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
  const rotate = (node, degrees, x = 0, y = 0) =>
    node.setAttribute('transform', 'rotate(' + degrees + ' ' + x + ' ' + y + ')');

  const crank = { x: 549, y: 441, radius: 27 };
  const wheelRadius = 72;
  const gearRatio = 24 / 12;
  const cadence = 0.43; // crank revolutions per second
  const turn = 2 * Math.PI;
  const toDegrees = 180 / Math.PI;
  const rearWheel = get('rear-wheel'), frontWheel = get('front-wheel');
  const sprocket = get('sprocket'), crankGlint = get('crank-glint'), chainLinks = get('chain-links');
  const rider = get('rider'), scarfNear = get('scarf-near'), scarfFar = get('scarf-far');
  const gulls = get('gulls'), waves = get('sea-lines'), road = get('road-marks');
  const layers = [
    { node: get('clouds'), speed: .006, period: 1120 },
    { node: get('distant-coast'), speed: .014, period: 1120 },
    { node: get('boats'), speed: .024, period: 1120 },
    { node: get('dunes'), speed: .14, period: 1120 },
    { node: get('roadside'), speed: 1.12, period: 800 }
  ];
  function legParts(side, x, y) {
    return { hipX: x, hipY: y, path: get(side + '-leg-path'), foot: get(side + '-foot'),
      pedal: get(side + '-pedal'), arm: get(side + '-crank') };
  }
  const near = legParts('near', 512, 310);
  const far = legParts('far', 529, 307);

  // Solve the two leg segments from the moving hip to the ankle resting on the pedal.
  // The rearward intersection gives the bird its characteristic bent hock.
  function placeLeg(leg, angle, lift) {
    const px = crank.x + Math.cos(angle) * crank.radius;
    const py = crank.y + Math.sin(angle) * crank.radius;
    const hipY = leg.hipY + lift;
    const ankleX = px - 14, ankleY = py - 9;
    const dx = ankleX - leg.hipX, dy = ankleY - hipY;
    const length = Math.hypot(dx, dy);
    const thigh = 81, shank = 80;
    const along = (thigh * thigh - shank * shank + length * length) / (2 * length);
    const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
    const jointX = leg.hipX + (along * dx - bend * dy) / length;
    const jointY = hipY + (along * dy + bend * dx) / length;
    leg.path.setAttribute('d', 'M' + leg.hipX + ' ' + hipY + 'L' + jointX + ' ' + jointY + 'L' + ankleX + ' ' + ankleY);
    leg.arm.setAttribute('x2', px);
    leg.arm.setAttribute('y2', py);
    translate(leg.pedal, px, py);
    translate(leg.foot, px, py);
    if (leg === near) {
      crankGlint.setAttribute('x2', px);
      crankGlint.setAttribute('y2', py);
    }
  }

  function draw(seconds) {
    const angle = seconds * cadence * turn;
    const wheelAngle = angle * gearRatio;
    const distance = wheelAngle * wheelRadius;
    const phase = angle + .64;
    const lift = 1.35 * Math.sin(2 * phase);
    rotate(rearWheel, wheelAngle * toDegrees % 360);
    rotate(frontWheel, wheelAngle * toDegrees % 360);
    rotate(sprocket, phase * toDegrees % 360);
    chainLinks.setAttribute('stroke-dashoffset', -(angle * 24 % 5.2));
    translate(rider, 0, lift);
    placeLeg(far, phase + Math.PI, lift);
    placeLeg(near, phase, lift);
    rotate(scarfNear, 3.2 * Math.sin(seconds * 4.2) + 1.2 * Math.sin(seconds * 7.5), 558, 210);
    rotate(scarfFar, 4.1 * Math.sin(seconds * 3.8 + 1.1), 558, 210);
    for (const layer of layers) {
      const rise = layer.node.id === 'boats' ? 1.1 * Math.sin(seconds * 1.6) : 0;
      translate(layer.node, -(distance * layer.speed % layer.period), rise);
    }
    waves.setAttribute('patternTransform', 'translate(' + -(distance * .036 % 211) + ' 0)');
    road.setAttribute('patternTransform', 'translate(' + -(distance % 276) + ' 0)');
    translate(gulls, 4.5 * Math.sin(seconds * .31), 2.3 * Math.sin(seconds * .96));
  }

  const button = get('playback'), label = get('playback-label');
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !motionPreference.matches;
  let chosenByUser = false, elapsed = 0, lastTime = null, frame = 0;

  function tick(time) {
    if (lastTime !== null) elapsed += (time - lastTime) / 1000;
    lastTime = time;
    draw(elapsed);
    frame = requestAnimationFrame(tick);
  }

  function syncPlayback() {
    cancelAnimationFrame(frame);
    lastTime = null;
    button.dataset.playing = String(playing);
    label.textContent = playing ? '暂停动画' : '播放动画';
    if (playing && !document.hidden) frame = requestAnimationFrame(tick);
  }

  button.addEventListener('click', () => {
    chosenByUser = true;
    playing = !playing;
    syncPlayback();
  });
  document.addEventListener('visibilitychange', syncPlayback);
  motionPreference.addEventListener('change', event => {
    if (!chosenByUser) { playing = !event.matches; syncPlayback(); }
  });
  draw(0);
  button.hidden = false;
  syncPlayback();
})();
</script>
</body>
