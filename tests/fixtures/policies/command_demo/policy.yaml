schema_version: 3
id: command_demo
execution:
  mode: sync
  call_every_actions: 10
  control_mode: qpos
  tui_command_workers: 4
params:
  chunk_size: 20
hot_reloadable:
- params.chunk_size
tui_commands:
  test:
    handler: test
    args:
    - str
    - int
    help: 记录字符串和整数，返回调用信息
    timeout_s: 30
  delay:
    handler: delay
    args:
    - float
    help: 等待指定秒数，演示与推理/其他命令并行
    timeout_s: -1
