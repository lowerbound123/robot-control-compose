services:
  policy:
    image: robot-control-compose-qwen35:local
    build:
      context: ../..
      dockerfile: policy/qwen35_single/Dockerfile
      target: runtime
      additional_contexts:
        policy-deps: ./dependencies
    restart: "no"
    platform: linux/amd64
    environment:
      PYTHONPATH: /workspace/policy/qwen35_single/src:/workspace/policy/qwen35_single/vendor
      RC_SOURCE_MODULES: '{"rc_qwen35_policy":"/workspace/policy/qwen35_single/src","lerobot":"/workspace/policy/qwen35_single/vendor"}'
      USER: robot-control
      LOGNAME: robot-control
      HF_HOME: /data/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - type: bind
        source: ${RC_HOST_PROJECT_ROOT:?Run setup.sh first}/policy/qwen35_single/src
        target: /workspace/policy/qwen35_single/src
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RC_HOST_PROJECT_ROOT:?Run setup.sh first}/policy/qwen35_single/vendor
        target: /workspace/policy/qwen35_single/vendor
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RC_HOST_PROJECT_ROOT:?Run setup.sh first}/policy/qwen35_single/vendor/lerobot/policies/qwen3_5vla/transformers_replace/models/qwen3_5/modeling_qwen3_5.py
        target: /usr/local/lib/python3.11/site-packages/transformers/models/qwen3_5/modeling_qwen3_5.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MODELS_DIR:?Set deployment.env MODELS_DIR}
        target: /models
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HF_CACHE_DIR:?Set deployment.env HF_CACHE_DIR}
        target: /data/huggingface
        bind: {create_host_path: false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]
