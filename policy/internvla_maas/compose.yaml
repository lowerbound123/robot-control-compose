services:
  policy:
    image: robot-control-compose-internvla-maas:local
    build:
      context: ../..
      dockerfile: policy/internvla_maas/Dockerfile
      target: runtime
      additional_contexts:
        policy-deps: ./dependencies
    restart: "no"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      PYTHONPATH: /workspace/policy/internvla_maas/src
      RC_SOURCE_MODULES: '{"rc_internvla_maas":"/workspace/policy/internvla_maas/src"}'
    volumes:
      - type: bind
        source: ${RC_HOST_PROJECT_ROOT:?Run setup.sh first}/policy/internvla_maas/src
        target: /workspace/policy/internvla_maas/src
        read_only: true
        bind: {create_host_path: false}
