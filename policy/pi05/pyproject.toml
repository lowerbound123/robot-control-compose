[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-pi05-policy"
version = "0.1.0"
description = "Local LeRobot Pi05 policy for the robot-control schema 3 runtime"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.3", "rc-policy-sdk>=0.9.1"]

[tool.setuptools.packages.find]
where = ["src"]
