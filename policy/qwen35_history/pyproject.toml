[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-qwen35-history-policy"
version = "0.1.0"
description = "Process-local visual history and Qwen3.5 flow-matching deployment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.3", "rc-policy-sdk>=0.13.0"]

[tool.setuptools.packages.find]
where = ["src"]
