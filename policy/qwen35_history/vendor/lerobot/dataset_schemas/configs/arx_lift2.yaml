# LIFT2 native order: left arm(6), left gripper(1), right arm(6), right gripper(1).
robot_type: arx_lift2
action_mask_spec: [6, -1, 6, -1]
# Map native 14D coordinates into the history model's padded 32D layout.
# Grippers occupy model columns 7 and 15; columns 6, 14 and 16:32 stay zero.
action_reorder:
  - [0, 6, 0, 6]
  - [6, 7, 7, 8]
  - [7, 13, 8, 14]
  - [13, 14, 15, 16]
state_reorder:
  - [0, 6, 0, 6]
  - [6, 7, 7, 8]
  - [7, 13, 8, 14]
  - [13, 14, 15, 16]
feature_mapping:
  observation.state:
    - states.left_joint.position
    - states.left_gripper.position
    - states.right_joint.position
    - states.right_gripper.position
  action:
    - actions.left_joint.position
    - actions.left_gripper.position
    - actions.right_joint.position
    - actions.right_gripper.position
image_mapping:
  images.rgb.head: observation.images.image0
  images.rgb.hand_left: observation.images.image1
  images.rgb.hand_right: observation.images.image2
description: "LIFT2 dual-arm joint layout for the history model"
