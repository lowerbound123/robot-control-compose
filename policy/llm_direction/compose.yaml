services:
  policy:
    image: robot-control-compose-llm-direction:local
    build:
      context: ../..
      dockerfile: policy/llm_direction/Dockerfile
      target: runtime
    restart: "no"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      PYTHONPATH: /workspace/packages/llm-direction-policy/src
      RC_SOURCE_MODULES: '{"rc_llm_direction":"/workspace/packages/llm-direction-policy/src"}'
    volumes:
      - type: bind
        source: ${RC_HOST_PROJECT_ROOT:?Run setup.sh first}/packages/llm-direction-policy/src
        target: /workspace/packages/llm-direction-policy/src
        read_only: true
        bind: {create_host_path: false}
