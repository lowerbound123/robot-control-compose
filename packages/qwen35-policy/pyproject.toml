[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-qwen35-policy"
version = "0.1.0"
description = "Local Qwen3.5 single/two-stage policy and asynchronous action scheduling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.3", "rc-policy-sdk>=0.7.0"]

[tool.setuptools.packages.find]
where = ["src"]
