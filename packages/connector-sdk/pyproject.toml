[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-connector-sdk"
version = "0.1.0"
description = "FIFO device I/O and request-published POSIX image snapshots"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "posix-ipc==1.3.2"]

[tool.setuptools.packages.find]
where = ["src"]
