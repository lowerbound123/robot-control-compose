[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-policy-sdk"
version = "0.10.0"
description = "Isolated robot-control policy worker and shared image transport"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "posix-ipc==1.3.2"]

[tool.setuptools.packages.find]
where = ["src"]
