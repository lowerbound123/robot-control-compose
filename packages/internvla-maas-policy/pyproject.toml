[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-internvla-maas-policy"
version = "0.1.0"
description = "MaaS InternVLA client with Qwen single action scheduling"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "rc-policy-sdk>=0.13.0", "websockets==15.0.1",
                "msgpack==1.1.2", "Pillow==12.3.0", "ruamel.yaml==0.19.1"]

[tool.setuptools.packages.find]
where = ["src"]
