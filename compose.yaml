name: ${RC_BASE_PROJECT:?Run setup.sh first}
services:
  ipc-anchor:
    image: robot-control-compose-anchor:local
    build:
      context: .
      dockerfile: docker/ipc-anchor.Dockerfile
    user: "0:0"
    environment:
      RC_UID: ${RC_UID:?Run setup.sh first}
      RC_GID: ${RC_GID:?Run setup.sh first}
    ipc: shareable
    shm_size: ${RC_SHM_SIZE:-512m}
    volumes:
      - rpc:/run/robot-control
      - type: bind
        source: ./docker
        target: /workspace/docker
        read_only: true
        bind: {create_host_path: false}
    stop_grace_period: 5s
    restart: "no"
  robot-control:
    image: robot-control-compose-rc:local
    build:
      context: .
      dockerfile: docker/rc.Dockerfile
      target: runtime
    user: "${RC_UID}:${RC_GID}"
    group_add: ["${RC_DOCKER_GID:?Run setup.sh first}"]
    ipc: service:ipc-anchor
    depends_on:
      ipc-anchor: {condition: service_healthy}
    stdin_open: true
    tty: true
    environment:
      HOME: /tmp
      PYTHONPATH: /workspace/src:/workspace/packages/policy-sdk/src
      PYTHONPYCACHEPREFIX: /tmp/rc-pycache
      RC_SOURCE_MODULES: '{"robot_control":"/workspace/src","rc_policy_sdk":"/workspace/packages/policy-sdk/src"}'
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-83}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      ROBOT_CONTROL_MCP_TOKEN: ${ROBOT_CONTROL_MCP_TOKEN:-}
      RC_RUNTIME_CONTEXT: /workspace/.setup/runtime.json
      DOCKER_HOST: unix:///var/run/docker.sock
    command: ["python3", "-m", "robot_control", "--config", "/workspace/configs/rc.mock.yaml", "--mcp", "0.0.0.0:4000"]
    ports: ["127.0.0.1:${RC_MCP_PORT:-4000}:4000"]
    volumes:
      - rpc:/run/robot-control
      - type: bind
        source: ./src
        target: /workspace/src
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./packages
        target: /workspace/packages
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docker
        target: /workspace/docker
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RC_DOCKER_SOCKET:?Run setup.sh first}
        target: /var/run/docker.sock
        bind: {create_host_path: false}
      - type: bind
        source: ./.setup
        target: /workspace/.setup
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./configs
        target: /workspace/configs
        bind: {create_host_path: false}
      - type: bind
        source: ./policy
        target: /workspace/policy
        bind: {create_host_path: false}
      - type: bind
        source: ./outputs
        target: /workspace/outputs
        bind: {create_host_path: false}
      - type: bind
        source: ./snapshot
        target: /data/snapshot
        bind: {create_host_path: false}
    stop_grace_period: 125s
    restart: "no"
volumes:
  rpc:
    name: ${RC_RPC_VOLUME:?Run setup.sh first}
