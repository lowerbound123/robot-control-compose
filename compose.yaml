x-runtime: &runtime
  user: "${RC_UID:?Run ./scripts/setup-user.sh first}:${RC_GID:?Run ./scripts/setup-user.sh first}"
  tmpfs:
    - /tmp/robot-control:uid=${RC_UID},gid=${RC_GID},mode=0700

x-runtime-environment: &runtime-environment
  HOME: /tmp/robot-control
  XDG_CACHE_HOME: /tmp/robot-control/.cache

services:
  # Only this short-lived service is root. It has no host bind mounts.
  rpc-init:
    image: busybox:1.37.0
    user: "0:0"
    environment:
      RC_UID: ${RC_UID:?Run ./scripts/setup-user.sh first}
      RC_GID: ${RC_GID:?Run ./scripts/setup-user.sh first}
    command:
      - sh
      - -ec
      - |
        case "$$RC_UID" in ''|*[!0-9]*) echo 'RC_UID must be numeric' >&2; exit 1;; esac
        case "$$RC_GID" in ''|*[!0-9]*) echo 'RC_GID must be numeric' >&2; exit 1;; esac
        [ "$$RC_UID" -gt 0 ] || { echo 'RC_UID must not be root; run setup-user.sh without sudo' >&2; exit 1; }
        chown -hR "$$RC_UID:$$RC_GID" /run/robot-control
        chmod 0700 /run/robot-control
    volumes:
      - rpc:/run/robot-control
    restart: "no"

  ipc-anchor:
    image: busybox:1.37.0
    user: "${RC_UID:?Run ./scripts/setup-user.sh first}:${RC_GID:?Run ./scripts/setup-user.sh first}"
    command: ["sleep", "infinity"]
    ipc: shareable
    shm_size: ${RC_SHM_SIZE:-512m}
    stop_grace_period: 5s

  policy-hold:
    <<: *runtime
    image: robot-control-compose-policy:local
    build:
      context: .
      dockerfile: docker/policy.Dockerfile
      target: runtime
    ipc: service:ipc-anchor
    depends_on:
      rpc-init:
        condition: service_completed_successfully
      ipc-anchor:
        condition: service_started
    environment: *runtime-environment
    volumes:
      - rpc:/run/robot-control
      - type: bind
        source: ./policy
        target: /workspace/policy
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "python", "-m", "rc_policy_sdk.host", "--healthcheck", "--host-id", "hold", "--socket", "/run/robot-control/hold.sock", "--policy-root", "/workspace/policy"]
      interval: 2s
      timeout: 3s
      retries: 20
    stop_grace_period: 45s

  robot-control:
    <<: *runtime
    image: robot-control-compose-rc:local
    build:
      context: .
      dockerfile: docker/rc.Dockerfile
      target: runtime
    ipc: service:ipc-anchor
    depends_on:
      policy-hold:
        condition: service_healthy
    stdin_open: true
    tty: true
    environment:
      <<: *runtime-environment
      TERM: ${TERM:-xterm-256color}
      # Kitty Unicode placeholders encode image IDs in exact 24-bit RGB colors.
      COLORTERM: ${COLORTERM:-truecolor}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-83}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      ROBOT_CONTROL_MCP_TOKEN: ${ROBOT_CONTROL_MCP_TOKEN:-}
    command: ["python3", "-m", "robot_control", "--config", "/workspace/configs/rc.mock.json", "--mcp", "0.0.0.0:4000"]
    ports:
      - "127.0.0.1:${RC_MCP_PORT:-4000}:4000"
    volumes:
      - rpc:/run/robot-control
      - type: bind
        source: ./configs
        target: /workspace/configs
        bind: {create_host_path: false}
      - type: bind
        source: ./policy
        target: /workspace/policy
        bind: {create_host_path: false}
      - type: bind
        source: ./outputs
        target: /workspace/outputs
        bind: {create_host_path: false}
      - type: bind
        source: ./snapshot
        target: /data/snapshot
        bind: {create_host_path: false}
    stop_grace_period: 90s

  ros-sim:
    <<: *runtime
    image: robot-control-compose-rc:local
    profiles: [ros-sim]
    environment:
      <<: *runtime-environment
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-83}
      ROS_LOCALHOST_ONLY: "0"
    command: ["python3", "-m", "robot_control_test_sim.simulator", "--namespace", "/robot_control_test"]

volumes:
  rpc:
