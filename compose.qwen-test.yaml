# Test-only overlay: real 3.11 image/UDS/shm; substitute only the heavy CUDA backend.
# Use an isolated Compose project. Never apply this overlay to a robot deployment.
services:
  robot-control:
    command: ["python3", "-m", "robot_control", "--headless", "--config", "/workspace/policy/rc.json"]
    ports: !reset []
    volumes: !override
      - rpc:/run/robot-control
      - qwen-fixtures:/workspace/policy

  qwen-fixtures:
    # One-shot test data initialization; only the test volume is writable.
    user: "0:0"
    image: robot-control-compose-tests:local
    build:
      context: .
      dockerfile: docker/rc.Dockerfile
      target: test
    environment:
      RC_UID: ${RC_UID}
      RC_GID: ${RC_GID}
    command:
      - sh
      - -ec
      - python3 /opt/app/tests/qwen_helpers.py /workspace/policy; chown -hR "$$RC_UID:$$RC_GID" /workspace/policy
    volumes:
      - qwen-fixtures:/workspace/policy

  policy-qwen35-single:
    deploy:
      resources:
        reservations:
          devices: !reset []
    depends_on:
      qwen-fixtures:
        condition: service_completed_successfully
    volumes: !override
      - rpc:/run/robot-control
      - qwen-fixtures:/workspace/policy

  policy-qwen35-twostage:
    deploy:
      resources:
        reservations:
          devices: !reset []
    depends_on:
      qwen-fixtures:
        condition: service_completed_successfully
    volumes: !override
      - rpc:/run/robot-control
      - qwen-fixtures:/workspace/policy

  qwen-integration:
    user: "${RC_UID:?Run ./scripts/setup-user.sh first}:${RC_GID:?Run ./scripts/setup-user.sh first}"
    tmpfs:
      - /tmp/robot-control:uid=${RC_UID},gid=${RC_GID},mode=0700
    image: robot-control-compose-tests:local
    ipc: service:ipc-anchor
    depends_on:
      policy-qwen35-single:
        condition: service_healthy
      policy-qwen35-twostage:
        condition: service_healthy
    environment:
      HOME: /tmp/robot-control
      XDG_CACHE_HOME: /tmp/robot-control/.cache
      RC_QWEN_DOCKER_TEST: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: /opt/app/packages/qwen35-policy/src
    command: ["python3", "-m", "pytest", "-p", "pytest_asyncio.plugin", "tests/test_qwen35_docker.py", "-q", "-rs"]
    volumes:
      - rpc:/run/robot-control
      - qwen-fixtures:/workspace/policy

volumes:
  qwen-fixtures:
