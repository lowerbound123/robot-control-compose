[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-qwen35-vendor"
version = "0.1.0"
description = "Self-contained Qwen3.5 KI/Wan action inference runtime for robot-control"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.10.0", "torchvision==0.25.0", "transformers==5.2.0",
  "numpy>=1.26,<3", "draccus>=0.10,<0.11", "safetensors>=0.4.3",
  "huggingface-hub>=1.3,<2", "packaging>=23", "PyYAML>=6", "typing-extensions>=4.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lerobot*"]
namespaces = true

[tool.setuptools.package-data]
"lerobot.dataset_schemas" = ["configs/*.yaml"]
"*" = ["transformers_replace/models/qwen3_5/*.py"]

[tool.setuptools.data-files]
"share/rc-qwen35-vendor" = ["PROVENANCE.md", "SOURCE_MANIFEST.json"]
