services:
  connector:
    image: robot-control-compose-acone-connector:local
    build:
      context: .
      additional_contexts:
        arx-msg: ../../ros_ws/src/arx5_arm_msg
        test-msg: ../../ros_ws/src/robot_control_test_msgs
      target: runtime
    network_mode: host
    environment:
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    restart: "no"
